<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading FIFArcade…</title><style>html,body{margin:0;min-height:100%;display:grid;place-items:center;background:#020604;color:#caff35;font:700 18px Arial}#status{text-align:center;padding:24px}</style></head><body><div id="status">Loading FIFArcade… ⚽🔥</div><script>(async()=>{try{const r=await fetch('https://raw.githubusercontent.com/recursionbane/recursionbane.github.io/main/games/index.html?cache='+Date.now());if(!r.ok)throw new Error('Could not load game');const h=await r.text();document.open();document.write(h);document.close()}catch(e){document.getElementById('status').innerHTML='FIFArcade failed to load.<br><small>'+e.message+'</small>'}})();</script></body></html>
